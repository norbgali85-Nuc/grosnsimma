<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROSN SIMMA – 2x ziehen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #b7aea0;
      overflow-x: hidden;
    }

    /* Scrollbarer Resopal-Tisch im Hintergrund */
    .tisch {
      position: relative;
      width: 100%;
      min-height: 140vh;
      background-color: #b7aea0;
      background-image:
        radial-gradient(circle at 85% 18%, rgba(255, 248, 232, 0.16) 0%, rgba(25, 20, 14, 0.24) 100%),
        url('tisch.jpg');
      background-size: 100% auto;
      background-repeat: repeat-y;
      background-position: top center;
      display: flex;
      justify-content: center;
    }

    /* Fixierte Karte – bleibt beim Scrollen an ihrem Platz */
    .karte-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: min(76vw, 320px);
    }

    .karte-link {
      display: block;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .karte-link:hover,
    .karte-link:focus-visible {
      transform: scale(1.015);
      outline: none;
    }

    .karte-link img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
      mix-blend-mode: multiply;
      filter:
        drop-shadow(0 14px 24px rgba(20, 16, 12, 0.38))
        drop-shadow(0 4px 8px rgba(20, 16, 12, 0.22));
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (min-width: 768px) {
      .tisch {
        background-size: cover;
      }
    }
  </style>
</head>
<body>
  <main class="tisch">
    <div class="karte-box">
      <a
        href="mailto:servus@grosnsimma.de?subject=du%20bist%20dran"
        class="karte-link"
        aria-label="Anfrage per E-Mail an servus@grosnsimma.de senden"
      >
        <img
          src="karte.png"
          alt="GROSN SIMMA – 2x ziehen, bayrisch Blatt und Stoff, servus@grosnsimma.de"
        />
      </a>
    </div>
  </main>
</body>
</html>
