<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROSN SIMMA – 2x ziehen | Bayerisches Blatt &amp; Siebdruck</title>
  <meta name="description" content="Grosn Simma – 2x ziehen. Bayerisches Blatt, Siebdruck &amp; Textil-Kultur. Bald geht's los." />
  <style>
    :root {
      --bg-paper: #f3eee2;
      --card-surface: #faf6ed;
      --ink-green: #183b28;
      --ink-green-light: #2b593f;
      --accent-gold: #b88a3b;
      --accent-red: #8c2f23;
      --shadow: 0 22px 50px rgba(24, 59, 40, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-paper);
      background-image:
        radial-gradient(rgba(24, 59, 40, 0.06) 1px, transparent 0);
      background-size: 22px 22px;
      color: var(--ink-green);
      font-family: Georgia, "Times New Roman", serif;
      padding: 2rem 1.25rem;
    }

    /* Die Spielkarte */
    .playing-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: var(--card-surface);
      border-radius: 22px;
      padding: 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(24, 59, 40, 0.22);
      transition: transform 0.35s ease;
    }

    .playing-card:hover {
      transform: translateY(-4px);
    }

    /* Innerer Kartenrahmen */
    .card-inner {
      position: relative;
      border: 2.5px solid var(--ink-green);
      border-radius: 14px;
      padding: 2.6rem 1.75rem 2.3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .card-inner::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(24, 59, 40, 0.28);
      border-radius: 10px;
      pointer-events: none;
    }

    /* Eckzeichen (7 + kleines Blatt) */
    .corner {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
      font-weight: 700;
      font-size: 1.55rem;
      color: var(--ink-green);
      user-select: none;
    }

    .corner-top {
      top: 16px;
      left: 18px;
    }

    .corner-bottom {
      bottom: 16px;
      right: 18px;
      transform: rotate(180deg);
    }

    .corner svg {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      fill: var(--ink-green);
    }

    /* Stempel oben */
    .badge {
      display: inline-block;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-red);
      border: 1.5px solid var(--accent-red);
      padding: 0.28rem 0.75rem;
      border-radius: 4px;
      margin-bottom: 1.35rem;
      transform: rotate(-1.5deg);
    }

    /* 7-Blatt-Arrangement (klassisch 3 - 1 - 3) */
    .pips-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.55rem 1.25rem;
      align-items: center;
      justify-items: center;
      margin: 0.35rem 0 1.45rem;
      width: 100%;
      max-width: 220px;
    }

    .pip {
      width: 44px;
      height: 44px;
      fill: var(--ink-green);
      transition: transform 0.3s ease;
    }

    .playing-card:hover .pip {
      transform: scale(1.06);
    }

    .pip-center {
      grid-column: 2;
    }

    .pip-flipped {
      transform: rotate(180deg);
    }

    .playing-card:hover .pip-flipped {
      transform: rotate(180deg) scale(1.06);
    }

    /* Typografie */
    h1 {
      font-size: clamp(2.1rem, 6vw, 2.65rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.05;
      color: var(--ink-green);
      margin-bottom: 0.45rem;
    }

    .claim {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.15rem;
      font-style: italic;
      color: var(--ink-green-light);
      margin-bottom: 1.5rem;
    }

    .claim::before,
    .claim::after {
      content: "—";
      color: var(--accent-gold);
      font-style: normal;
    }

    .divider {
      width: 64px;
      height: 2px;
      background: var(--accent-gold);
      margin: 0 auto 1.35rem;
      border: none;
    }

    .copy {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #2f3e35;
      max-width: 300px;
      margin-bottom: 1.75rem;
    }

    /* Kontakt / Mailto-Button im Stempel-Stil */
    .cta-btn {
      display: inline-block;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--card-surface);
      background: var(--ink-green);
      padding: 0.85rem 1.5rem;
      border-radius: 8px;
      border: 1.5px solid var(--ink-green);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .cta-btn:hover {
      background: transparent;
      color: var(--ink-green);
    }

    footer {
      margin-top: 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.78rem;
      color: rgba(24, 59, 40, 0.65);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <!-- Wiederverwendbares SVG-Symbol: Stilisiertes 7-fingriges Blatt im Wirtshaus-Linolschnitt-Look -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="grosn-leaf" viewBox="0 0 100 100">
        <!-- Stiel -->
        <path d="M48 74 L52 74 L53 94 L47 94 Z" />
        <!-- Hauptblatt Mitte -->
        <path d="M50 8 C44 26, 43 48, 50 74 C57 48, 56 26, 50 8 Z" />
        <!-- Inneres Paar -->
        <path d="M49 73 C37 54, 27 36, 23 22 C35 31, 44 48, 49 73 Z" />
        <path d="M51 73 C63 54, 73 36, 77 22 C65 31, 56 48, 51 73 Z" />
        <!-- Mittleres Paar -->
        <path d="M48 74 C31 63, 17 52, 9 43 C23 46, 37 57, 48 74 Z" />
        <path d="M52 74 C69 63, 83 52, 91 43 C77 46, 63 57, 52 74 Z" />
        <!-- Unteres kleines Paar -->
        <path d="M48 75 C35 72, 23 69, 15 67 C26 65, 38 69, 48 75 Z" />
        <path d="M52 75 C65 72, 77 69, 85 67 C74 65, 62 69, 52 75 Z" />
      </symbol>
    </defs>
  </svg>

  <main class="playing-card">
    <div class="card-inner">

      <!-- Ecke oben links -->
      <div class="corner corner-top" aria-hidden="true">
        <span>7</span>
        <svg><use href="#grosn-leaf" /></svg>
      </div>

      <!-- Ecke unten rechts -->
      <div class="corner corner-bottom" aria-hidden="true">
        <span>7</span>
        <svg><use href="#grosn-leaf" /></svg>
      </div>

      <span class="badge">Es wird gemischt</span>

      <!-- Die 7 Blätter im klassischen Karten-Raster -->
      <div class="pips-grid" aria-label="Sieben Blätter im Stil einer bayerischen Spielkarte">
        <svg class="pip"><use href="#grosn-leaf" /></svg>
        <svg class="pip"><use href="#grosn-leaf" /></svg>
        <svg class="pip"><use href="#grosn-leaf" /></svg>

        <svg class="pip pip-center"><use href="#grosn-leaf" /></svg>

        <svg class="pip pip-flipped"><use href="#grosn-leaf" /></svg>
        <svg class="pip pip-flipped"><use href="#grosn-leaf" /></svg>
        <svg class="pip pip-flipped"><use href="#grosn-leaf" /></svg>
      </div>

      <h1>Grosn Simma</h1>
      <p class="claim">2x ziehen</p>

      <hr class="divider" />

      <p class="copy">
        Bayerisches Blatt, ehrlicher Siebdruck &amp; Textilien mit Augenzwinkern.
        Die erste Auflage wird gerade gedruckt.
      </p>

      <a href="mailto:servus@grosnsimma.de?subject=Grosn%20Simma%20%E2%80%93%20Sag%20Bescheid!" class="cta-btn">
        Servus sagen
      </a>

    </div>
  </main>

  <footer>
    &copy; 2026 grosnsimma.de &middot; Made in Bavaria
  </footer>

</body>
</html>
