<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROSN SIMMA – 2x ziehen | bayrisch Blatt und Stoff</title>
  <meta name="description" content="GROSN SIMMA – 2x ziehen. bayrisch Blatt und Stoff. Kontakt: servus@grosnsimma.de" />
  <style>
    :root {
      --blattgruen: #2b7a3d;
      --blattgruen-glow: rgba(43, 122, 61, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #b7aea0;
      overflow: hidden;
    }

    .tisch-hintergrund {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #b7aea0;
      background-image:
        radial-gradient(circle at 78% 22%, rgba(255, 250, 238, 0.14) 0%, rgba(28, 22, 16, 0.24) 100%),
        url('tisch.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    .buehne {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .karte-rahmen {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      /* Auf dem Handy richtig groß */
      transform: scale(2.15);
      transform-origin: center center;
      pointer-events: auto;
    }

    .karte-bild {
      display: block;
      width: 94vw;
      max-width: none;
      height: auto;
      image-rendering: -webkit-optimize-contrast;
      filter:
        url(#fein-scharf)
        contrast(1.07)
        drop-shadow(0 16px 28px rgba(18, 14, 10, 0.4));
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Dezenter, edler Blattgrün-Hover ohne dicken Kasten */
    .mail-link {
      position: absolute;
      left: 51.4%;
      bottom: 4.5%;
      transform: translate(-50%, 0) rotate(-3.2deg);
      padding: 2px 6px;
      color: transparent;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(10px, 2.2vw, 18px);
      font-weight: 700;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color 0.22s ease, filter 0.22s ease;
    }

    .mail-link:hover,
    .mail-link:focus-visible {
      border-bottom-color: var(--blattgruen);
      filter: drop-shadow(0 0 6px var(--blattgruen-glow));
      outline: none;
    }

    @media (min-width: 768px) {
      .karte-rahmen {
        transform: scale(1.42);
      }

      .karte-bild {
        width: auto;
        height: 82vh;
        max-height: none;
      }

      .mail-link {
        font-size: clamp(12px, 1.5vw, 20px);
      }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="fein-scharf" x="-4%" y="-4%" width="108%" height="108%">
        <feConvolveMatrix
          order="3"
          kernelMatrix="0 -0.45 0 -0.45 2.8 -0.45 0 -0.45 0"
          preserveAlpha="true"
        />
      </filter>
    </defs>
  </svg>

  <div class="tisch-hintergrund" aria-hidden="true"></div>

  <main class="buehne">
    <div class="karte-rahmen">
      <img
        src="karte.png"
        alt="GROSN SIMMA – 2x ziehen, bayrisch Blatt und Stoff, servus@grosnsimma.de"
        class="karte-bild"
      />
      <a
        href="mailto:servus@grosnsimma.de"
        class="mail-link"
        aria-label="E-Mail an servus@grosnsimma.de senden"
      >servus@grosnsimma.de</a>
    </div>
  </main>
</body>
</html>
