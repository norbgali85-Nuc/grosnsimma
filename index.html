<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROSN SIMMA – 2x ziehen | bayrisch Blatt und Stoff</title>
  <meta name="description" content="GROSN SIMMA – 2x ziehen. bayrisch Blatt und Stoff. Kontakt: servus@grosnsimma.de" />
  <style>
    :root {
      --blattgruen: #266a36;
      --blattgruen-text: #f4f9f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background-color: #b7aea0;
      overflow: hidden;
    }

    .tisch-hintergrund {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #b7aea0;
      background-image:
        radial-gradient(circle at 78% 22%, rgba(255, 250, 238, 0.14) 0%, rgba(28, 22, 16, 0.24) 100%),
        url('tisch.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    .buehne {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .karte-rahmen {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      /* Zieht das breite Bild auf dem Handy deutlich größer, sodass die Karte fast den Screen füllt */
      transform: scale(1.75);
      transform-origin: center center;
      max-width: 100vw;
      max-height: 100dvh;
      pointer-events: auto;
    }

    .karte-bild {
      display: block;
      width: 92vw;
      max-width: 680px;
      height: auto;
      filter:
        contrast(1.06)
        drop-shadow(0 14px 26px rgba(18, 14, 10, 0.38));
      user-select: none;
      -webkit-user-drag: none;
    }

    .mail-link {
      position: absolute;
      left: 51.5%;
      bottom: 4.5%;
      transform: translate(-50%, 0) rotate(-3.2deg);
      padding: 3px 8px;
      border-radius: 4px;
      color: transparent;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(10px, 2.2vw, 18px);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .mail-link:hover,
    .mail-link:focus-visible {
      background-color: var(--blattgruen);
      color: var(--blattgruen-text);
      box-shadow: 0 3px 10px rgba(18, 44, 24, 0.45);
      outline: none;
    }

    @media (min-width: 768px) {
      .karte-rahmen {
        transform: scale(1.15);
      }

      .karte-bild {
        width: auto;
        max-width: min(88vw, 760px);
        max-height: 92vh;
      }

      .mail-link {
        font-size: clamp(12px, 1.5vw, 20px);
      }
    }
  </style>
</head>
<body>
  <div class="tisch-hintergrund" aria-hidden="true"></div>

  <main class="buehne">
    <div class="karte-rahmen">
      <img
        src="karte.png"
        alt="GROSN SIMMA – 2x ziehen, bayrisch Blatt und Stoff, servus@grosnsimma.de"
        class="karte-bild"
      />
      <a
        href="mailto:servus@grosnsimma.de"
        class="mail-link"
        aria-label="E-Mail an servus@grosnsimma.de senden"
      >servus@grosnsimma.de</a>
    </div>
  </main>
</body>
</html>
