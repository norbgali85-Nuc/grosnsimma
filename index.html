<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROSN SIMMA – 2x ziehen | bayrisch Blatt und Stoff</title>
  <meta name="description" content="GROSN SIMMA – 2x ziehen. bayrisch Blatt und Stoff. Anfrage: servus@grosnsimma.de" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #b7aea0;
      overflow: hidden;
    }

    /* Fixierter Resopal-Tisch im Hintergrund */
    .tisch-hintergrund {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #b7aea0;
      background-image:
        radial-gradient(circle at 78% 22%, rgba(255, 250, 238, 0.14) 0%, rgba(28, 22, 16, 0.24) 100%),
        url('tisch.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    /* Fixierte Kartenbühne */
    .buehne {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .karte-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: scale(2.55);
      transform-origin: center center;
      text-decoration: none;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }

    .karte-link:focus-visible {
      outline: 2px solid rgba(43, 122, 61, 0.7);
      outline-offset: 4px;
      border-radius: 6px;
    }

    .karte-bild {
      display: block;
      width: 92vw;
      max-width: none;
      height: auto;
      image-rendering: -webkit-optimize-contrast;
      filter:
        url(#fein-scharf)
        contrast(1.07)
        drop-shadow(0 16px 28px rgba(18, 14, 10, 0.4));
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (min-width: 768px) {
      .karte-link {
        transform: scale(1.18);
      }

      .karte-bild {
        width: auto;
        height: 76vh;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="fein-scharf" x="-4%" y="-4%" width="108%" height="108%">
        <feConvolveMatrix
          order="3"
          kernelMatrix="0 -0.45 0 -0.45 2.8 -0.45 0 -0.45 0"
          preserveAlpha="true"
        />
      </filter>
    </defs>
  </svg>

  <div class="tisch-hintergrund" aria-hidden="true"></div>

  <main class="buehne">
    <a
      href="mailto:servus@grosnsimma.de?subject=Anfrage%20GROSN%20SIMMA"
      class="karte-link"
      aria-label="Anfrage an servus@grosnsimma.de senden"
    >
      <img
        src="karte.png"
        alt="GROSN SIMMA – 2x ziehen, bayrisch Blatt und Stoff, servus@grosnsimma.de"
        class="karte-bild"
      />
    </a>
  </main>
</body>
</html>
