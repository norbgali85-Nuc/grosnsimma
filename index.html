<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROSN SIMMA – 2x ziehen | bayrisch Blatt und Stoff</title>
  <meta name="description" content="GROSN SIMMA – 2x ziehen. bayrisch Blatt und Stoff. Kontakt: servus@grosnsimma.de" />
  <style>
    :root {
      --blattgruen: #266a36;
      --blattgruen-text: #f3f8f4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background-color: #b7aea0;
      overflow-x: hidden;
    }

    /* Fixierter Resopal-Tisch im Hintergrund – bleibt beim Scrollen stehen */
    .tisch-hintergrund {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #b7aea0;
      background-image:
        radial-gradient(circle at 78% 22%, rgba(255, 250, 238, 0.16) 0%, rgba(28, 22, 16, 0.25) 100%),
        url('tisch.jpg'),
        url('tisch_4.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    /* Fixierte Bühne – Mobile First groß, bleibt beim Scrollen genau da liegen */
    .buehne {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      pointer-events: none;
    }

    .karte-rahmen {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      /* Mobile First: füllt den Handy-Bildschirm fast ganz aus */
      width: 98vw;
      max-height: 97dvh;
      pointer-events: auto;
    }

    .karte-bild {
      display: block;
      width: 100%;
      max-width: 100%;
      max-height: 97dvh;
      width: auto;
      height: auto;
      /* Blendet weiße Bildränder weich aus, damit nur die Karte auf dem Tisch liegt */
      -webkit-mask-image: radial-gradient(ellipse 43% 47% at 50% 50%, #000 72%, rgba(0, 0, 0, 0.65) 86%, transparent 99%);
      mask-image: radial-gradient(ellipse 43% 47% at 50% 50%, #000 72%, rgba(0, 0, 0, 0.65) 86%, transparent 99%);
      filter:
        drop-shadow(0 22px 42px rgba(18, 14, 10, 0.42))
        drop-shadow(0 6px 14px rgba(18, 14, 10, 0.25));
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Klickbarer Mail-Link direkt über servus@grosnsimma.de unten auf der Karte */
    .mail-link {
      position: absolute;
      left: 51.5%;
      bottom: 4.8%;
      transform: translate(-50%, 0) rotate(-3.2deg);
      padding: 4px 10px;
      border-radius: 5px;
      color: transparent;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(13px, 3.6vw, 22px);
      font-weight: 700;
      letter-spacing: 0.01em;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .mail-link:hover,
    .mail-link:focus-visible {
      background-color: var(--blattgruen);
      color: var(--blattgruen-text);
      box-shadow: 0 3px 12px rgba(18, 44, 24, 0.42);
      outline: none;
    }

    /* Größere Bildschirme (Tablet & Desktop): ebenfalls groß und gut lesbar */
    @media (min-width: 768px) {
      .buehne {
        padding: 16px;
      }

      .karte-rahmen {
        width: auto;
        max-width: min(92vw, 760px);
        max-height: 95vh;
      }

      .karte-bild {
        max-height: 95vh;
      }

      .mail-link {
        font-size: clamp(13px, 1.7vw, 22px);
      }
    }
  </style>
</head>
<body>
  <div class="tisch-hintergrund" aria-hidden="true"></div>

  <main class="buehne">
    <div class="karte-rahmen">
      <img
        src="karte.png"
        alt="GROSN SIMMA – 2x ziehen, bayrisch Blatt und Stoff, servus@grosnsimma.de"
        class="karte-bild"
      />
      <a
        href="mailto:servus@grosnsimma.de"
        class="mail-link"
        aria-label="E-Mail an servus@grosnsimma.de senden"
      >servus@grosnsimma.de</a>
    </div>
  </main>
</body>
</html>
