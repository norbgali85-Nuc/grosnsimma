<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROSN SIMMA – 2x ziehen | bayrisch Blatt und Stoff</title>
  <meta name="description" content="GROSN SIMMA – 2x ziehen. bayrisch Blatt und Stoff. servus@grosnsimma.de" />
  <style>
    :root {
      --blattgruen: #266a36;
      --blattgruen-text: #f3f8f4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background-color: #b7aea0;
      overflow-x: hidden;
    }

    /* Fixierter bayerischer Wirtshaustisch im Hintergrund */
    .tisch-hintergrund {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #b7aea0;
      background-image:
        radial-gradient(circle at 78% 22%, rgba(255, 250, 238, 0.14) 0%, rgba(28, 22, 16, 0.24) 100%),
        url('tisch.jpg'),
        url('tisch_3.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    /* Fixierte Mitte – füllt fast den ganzen Bildschirm und bleibt beim Scrollen stehen */
    .buehne {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(8px, 2vh, 22px);
      pointer-events: none;
    }

    .karte-rahmen {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: min(95vw, 680px);
      max-height: 94vh;
      pointer-events: auto;
    }

    .karte-bild {
      display: block;
      max-width: 100%;
      max-height: 94vh;
      width: auto;
      height: auto;
      border-radius: 14px;
      box-shadow:
        0 26px 54px rgba(18, 14, 10, 0.45),
        0 8px 18px rgba(18, 14, 10, 0.26);
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Klickbare Mail-Fläche über servus@grosnsimma.de unten auf der Karte */
    .mail-link {
      position: absolute;
      left: 51.5%;
      bottom: 4.8%;
      transform: translate(-50%, 0) rotate(-3.2deg);
      padding: 3px 10px;
      border-radius: 5px;
      color: transparent;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(12px, 1.65vw, 22px);
      font-weight: 700;
      letter-spacing: 0.01em;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .mail-link:hover,
    .mail-link:focus-visible {
      background-color: var(--blattgruen);
      color: var(--blattgruen-text);
      box-shadow: 0 3px 12px rgba(18, 44, 24, 0.42);
      outline: none;
    }
  </style>
</head>
<body>
  <div class="tisch-hintergrund" aria-hidden="true"></div>

  <main class="buehne">
    <div class="karte-rahmen">
      <img
        src="karte.png"
        alt="GROSN SIMMA – 2x ziehen, bayrisch Blatt und Stoff, servus@grosnsimma.de"
        class="karte-bild"
      />
      <a
        href="mailto:servus@grosnsimma.de"
        class="mail-link"
        aria-label="E-Mail an servus@grosnsimma.de senden"
      >servus@grosnsimma.de</a>
    </div>
  </main>
</body>
</html>
